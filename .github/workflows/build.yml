name: Build Prononce for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Prononce.sln

      - name: Build Solution (Release)
        run: dotnet build Prononce.sln -c Release --no-restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/Prononce/Prononce.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/ `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path dist/Prononce.exe -DestinationPath dist/Prononce-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prononce-Windows-x64
          path: dist/Prononce.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Prononce-Windows-x64.zip
            dist/Prononce.exe
          draft: false
          prerelease: false
          generate_release_notes: true
