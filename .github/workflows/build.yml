name: Build Prononce for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Prononce.sln

      - name: Build Solution (Release)
        run: dotnet build Prononce.sln -c Release --no-restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/Prononce/Prononce.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/ `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prononce-Windows-x64
          path: dist/Prononce.exe
