name: Build Prononce for Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_release:
        description: 'Publish as a public GitHub Release?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Prononce.sln

      - name: Build Solution (Release)
        run: dotnet build Prononce.sln -c Release --no-restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/Prononce/Prononce.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/ `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path dist/Prononce.exe -DestinationPath dist/Prononce-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prononce-Windows-x64
          path: dist/Prononce.exe

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.create_release }}" = "true" ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release_info.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Prononce Windows ${{ steps.release_info.outputs.tag }}
          files: |
            dist/Prononce-Windows-x64.zip
            dist/Prononce.exe
          draft: false
          prerelease: false
          generate_release_notes: true
